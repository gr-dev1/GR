<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR - الأقوى في ببجي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Accessories/photos/favicon.ico" type="image/x-icon">
    
    <!-- إضافة Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- إضافة Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- إضافة Animate.css للأنيميشن -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        /* أنيميشن مخصص */
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #9d4edd, 0 0 20px #9d4edd, 0 0 30px #9d4edd; }
            50% { text-shadow: 0 0 20px #7b2cbf, 0 0 30px #7b2cbf, 0 0 40px #7b2cbf; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(157, 78, 221, 0.5); box-shadow: 0 0 15px rgba(157, 78, 221, 0.3); }
            50% { border-color: rgba(157, 78, 221, 0.8); box-shadow: 0 0 25px rgba(157, 78, 221, 0.5); }
        }
    </style>
</head>
<body>
    <!-- الخلفية -->
    <div class="background"></div>
    
    <!-- شاشة البدء -->
    <div class="start-screen" id="startScreen">
        <div class="start-content animate__animated animate__fadeIn">
            <!-- شعار GR متحرك -->
            <div class="gr-logo animate__animated animate__pulse animate__infinite" style="animation-duration: 2s;">
                <span class="gr-text">GR</span>
                <div class="logo-crown">
                    <i class="fas fa-crown"></i>
                </div>
            </div>
            
            <h1 class="welcome-title animate__animated animate__slideInDown">
                <span class="highlight">أهلاً بك في</span>
                <span class="gr-name">GR</span>
            </h1>
            
            <p class="welcome-subtitle animate__animated animate__fadeInUp animate__delay-1s">
                <i class="fas fa-trophy"></i>
                الأقوى في عالم ببجي
                <i class="fas fa-trophy"></i>
            </p>
            
            <div class="definition animate__animated animate__fadeInUp animate__delay-2s">
                <p>
                    <i class="fas fa-star"></i>
                    فريق GR - ليس مجرد كلان، إنه أسطورة في عالم ببجي
                    <i class="fas fa-star"></i>
                </p>
            </div>
            
            <button class="start-btn animate__animated animate__pulse animate__infinite" id="startBtn" style="animation-duration: 1.5s;">
                <i class="fas fa-play"></i>
                ابدأ الرحلة
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <!-- جسيمات متحركة -->
            <div class="floating-elements">
                <div class="floating-icon">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="floating-icon">
                    <i class="fas fa-crosshairs"></i>
                </div>
                <div class="floating-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
            </div>
        </div>
    </div>
    
    <!-- المحمل (مخفي في البداية) -->
    <div class="loader-container" id="loaderContainer" style="display: none;">
        <!-- المحمل المعدل -->
        <div class="loader">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <defs>
                    <mask id="clipping">
                        <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
                        <polygon points="25,25 75,25 50,75" fill="white"></polygon>
                        <polygon points="50,25 75,75 25,75" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                    </mask>
                </defs>
            </svg>
            <div class="box"></div>
        </div>
        
        <!-- نص التحميل -->
        <div class="loading-text">
            <h2>جاري التحضير للرحلة...</h2>
            <p>فريق GR يستعد لاستقبالك</p>
        </div>
    </div>

    <!-- مؤقت التقدم -->
    <div class="timer" id="timer" style="display: none;">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <span class="time-left">12</span> ثانية
    </div>

    <!-- الصوت -->
    <audio id="loading-sound" preload="auto">
        <source src="Accessories/voices/sound.mp3" type="audio/mpeg">
        <source src="Accessories/voices/sound.ogg" type="audio/ogg">
        <source src="Accessories/voices/sound.wav" type="audio/wav">
    </audio>

    <!-- الصفحة التالية -->
    <iframe src="next-page.html" style="display:none;" id="nextPage"></iframe>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
