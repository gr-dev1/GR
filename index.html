<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR - الأقوى في ببجي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Accessories/photos/favicon.ico" type="image/x-icon">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    
    <style>
        /* تأثيرات مخصصة */
        .floating-particle {
            position: absolute;
            background: linear-gradient(45deg, #9d4edd, #7b2cbf);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <!-- الجسيمات المتحركة -->
    <div id="particles"></div>
    
    <!-- الخلفية مع تأثير -->
    <div class="background-overlay">
        <div class="bg-gradient"></div>
    </div>
    
    <!-- شاشة الترحيب -->
    <div class="welcome-screen active" id="welcomeScreen">
        <!-- شريط أعلى الشاشة -->
        <div class="top-bar glass-effect">
            <div class="top-bar-content">
                <div class="top-bar-logo">
                    <span class="gr-mini">GR</span>
                    <i class="fas fa-crown"></i>
                </div>
                <div class="top-bar-info">
                    <span class="info-item">
                        <i class="fas fa-trophy"></i>
                        الأسطورة
                    </span>
                    <span class="info-item">
                        <i class="fas fa-users"></i>
                        فريق النخبة
                    </span>
                </div>
            </div>
        </div>
        
        <!-- المحتوى الرئيسي -->
        <div class="welcome-content">
            <!-- الشعار الكبير -->
            <div class="main-logo">
                <div class="logo-circle glass-effect">
                    <span class="gr-large">GR</span>
                    <div class="logo-ring"></div>
                    <div class="logo-particles">
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                        <i class="fas fa-star"></i>
                    </div>
                </div>
            </div>
            
            <!-- العنوان -->
            <div class="welcome-text">
                <h1 class="title glass-effect">
                    <span class="greeting">أهلاً بك في</span>
                    <span class="gr-name-glow">GR</span>
                </h1>
                <p class="subtitle glass-effect">
                    <i class="fas fa-crown gold"></i>
                    الأقوى في عالم ببجي
                    <i class="fas fa-crown gold"></i>
                </p>
            </div>
            
            <!-- تعريف الفريق -->
            <div class="team-definition glass-effect">
                <div class="definition-content">
                    <div class="definition-icon">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <p class="definition-text">
                        ليس مجرد فريق... إنه <span class="highlight">أسطورة</span> تصنع الفرق
                    </p>
                </div>
            </div>
            
            <!-- إحصاءات سريعة -->
            <div class="quick-stats">
                <div class="stat-card glass-effect">
                    <i class="fas fa-trophy stat-icon"></i>
                    <div class="stat-number">50+</div>
                    <div class="stat-label">بطولة</div>
                </div>
                <div class="stat-card glass-effect">
                    <i class="fas fa-user-ninja stat-icon"></i>
                    <div class="stat-number">100+</div>
                    <div class="stat-label">لاعب محترف</div>
                </div>
                <div class="stat-card glass-effect">
                    <i class="fas fa-flag stat-icon"></i>
                    <div class="stat-number">3</div>
                    <div class="stat-label">سنوات قيادة</div>
                </div>
            </div>
            
            <!-- زر البدء -->
            <button class="start-btn glass-effect" id="startBtn">
                <div class="btn-content">
                    <i class="fas fa-play-circle btn-icon"></i>
                    <span class="btn-text">ابدأ الرحلة</span>
                    <div class="btn-glow"></div>
                </div>
                <div class="btn-arrow">
                    <i class="fas fa-chevron-left"></i>
                </div>
            </button>
            
            <!-- إشعار الصوت -->
            <div class="sound-notice glass-effect">
                <i class="fas fa-volume-up"></i>
                <span>سيتم تشغيل موسيقى تلقائياً</span>
            </div>
        </div>
        
        <!-- العناصر المتحركة -->
        <div class="floating-elements">
            <div class="floating-shape shape-1"></div>
            <div class="floating-shape shape-2"></div>
            <div class="floating-shape shape-3"></div>
        </div>
    </div>
    
    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <!-- العنوان أثناء التحميل -->
        <div class="loading-header glass-effect">
            <h2>
                <i class="fas fa-spinner fa-spin"></i>
                جاري تحضير عالم GR
            </h2>
            <p>فريق النخبة يستعد لاستقبالك</p>
        </div>
        
        <!-- المحمل المعدل -->
        <div class="loader-wrapper">
            <div class="loader-new">
                <div class="loader-inner">
                    <div class="loader-core"></div>
                    <div class="loader-ring ring-1"></div>
                    <div class="loader-ring ring-2"></div>
                    <div class="loader-ring ring-3"></div>
                    <div class="loader-particles">
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                        <div class="particle"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- التقدم -->
        <div class="loading-progress">
            <div class="progress-container glass-effect">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-info">
                    <span class="progress-text">جاري التحميل</span>
                    <span class="progress-percent">0%</span>
                </div>
            </div>
            
            <!-- المؤقت -->
            <div class="timer glass-effect">
                <div class="timer-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="timer-display">
                    <span class="time-left">12</span>
                    <span class="time-label">ثانية</span>
                </div>
            </div>
        </div>
        
        <!-- نصائح أثناء التحميل -->
        <div class="loading-tips glass-effect">
            <div class="tips-content">
                <i class="fas fa-lightbulb tips-icon"></i>
                <div class="tips-text">
                    <span class="tip">فريق GR يضمن لك تجربة لعب استثنائية</span>
                </div>
            </div>
        </div>
    </div>

    <!-- الصوت -->
    <audio id="loadingSound" preload="auto">
        <source src="Accessories/voices/sound.mp3" type="audio/mpeg">
        <source src="Accessories/voices/sound.ogg" type="audio/ogg">
        <source src="Accessories/voices/sound.wav" type="audio/wav">
    </audio>

    <!-- الصفحة التالية -->
    <iframe src="next-page.html" style="display:none;" id="nextPage"></iframe>

    <script src="script.js"></script>
</body>
</html>
