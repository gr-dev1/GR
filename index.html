<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GR - الأقوى في ببجي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Accessories/photos/favicon.ico" type="image/x-icon">
    
    <!-- Font Awesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    <!-- الخلفية الزجاجية -->
    <div class="glass-background"></div>
    
    <!-- النجوم المتلألئة -->
    <div class="star-field"></div>
    
    <!-- شاشة الترحيب -->
    <div class="welcome-screen" id="welcomeScreen">
        <!-- طبقة تأثير زجاجي -->
        <div class="glass-overlay"></div>
        
        <!-- المحتوى الرئيسي -->
        <div class="welcome-container">
            <div class="welcome-content">
                <!-- الشعار الرئيسي -->
                <div class="main-logo">
                    <div class="logo-circle">
                        <span class="logo-text">GR</span>
                    </div>
                    <div class="crown-icon">
                        <i class="fas fa-crown"></i>
                    </div>
                </div>
                
                <!-- العنوان الرئيسي -->
                <div class="title-section">
                    <h1 class="main-title">
                        <span class="welcome-text">أهلاً بك في</span>
                        <span class="gr-name">GR</span>
                    </h1>
                    <div class="title-line"></div>
                </div>
                
                <!-- الوصف -->
                <div class="description-section">
                    <div class="tagline-box">
                        <p class="tagline">
                            <i class="fas fa-star"></i>
                            ليس مجرد كلان .. إنه أسطورة
                            <i class="fas fa-star"></i>
                        </p>
                    </div>
                    <div class="slogan">
                        <p class="slogan-text">
                            <i class="fas fa-quote-right"></i>
                            الأقوى في عالم ببجي
                            <i class="fas fa-quote-left"></i>
                        </p>
                    </div>
                </div>
                
                <!-- زر البدء -->
                <div class="button-container">
                    <button class="start-btn" id="startButton">
                        <span class="btn-text">
                            <i class="fas fa-play"></i>
                            ابدأ الرحلة
                        </span>
                        <span class="btn-glow"></span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- الزخارف الجانبية -->
        <div class="decorations">
            <div class="decoration deco-1"></div>
            <div class="decoration deco-2"></div>
            <div class="decoration deco-3"></div>
            <div class="decoration deco-4"></div>
            <div class="decoration deco-5"></div>
            <div class="decoration deco-6"></div>
        </div>
        
        <!-- الزوايا الزخرفية -->
        <div class="corner-decor top-left-corner">
            <div class="corner-line"></div>
            <div class="corner-dot"></div>
        </div>
        
        <div class="corner-decor bottom-right-corner">
            <div class="corner-line"></div>
            <div class="corner-dot"></div>
        </div>
    </div>
    
    <!-- شاشة التحميل -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-container">
            <!-- المحمل المعدل -->
            <div class="loader-section">
                <div class="purple-loader">
                    <div class="loader-core"></div>
                    <div class="loader-ring"></div>
                    <div class="loader-glow"></div>
                </div>
                
                <!-- النصوص -->
                <div class="loading-text-section">
                    <h3 class="loading-title">
                        <i class="fas fa-spinner fa-spin"></i>
                        جاري الإعداد للرحلة
                    </h3>
                    <p class="loading-subtitle">فريق GR يستعد لاستقبالك</p>
                </div>
            </div>
            
            <!-- شريط التقدم -->
            <div class="progress-section">
                <div class="progress-wrapper">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-info">
                        <span class="time-count" id="timeCount">12</span>
                        <span class="time-label">ثانية</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- زخارف التحميل -->
        <div class="loading-decorations">
            <div class="loading-dot dot-1"></div>
            <div class="loading-dot dot-2"></div>
            <div class="loading-dot dot-3"></div>
        </div>
    </div>

    <!-- الصوت -->
    <audio id="loadingAudio" preload="auto">
        <source src="Accessories/voices/sound.mp3" type="audio/mpeg">
        <source src="Accessories/voices/sound.ogg" type="audio/ogg">
    </audio>

    <!-- الصفحة التالية -->
    <iframe src="next-page.html" style="display:none;" id="nextPage"></iframe>

    <!-- GSAP Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
