<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Accessories/photos/favicon.ico" type="image/x-icon">
    
    <!-- إضافة meta tags مهمة للصوت -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffbf48">
</head>
<body>
    <!-- الخلفية -->
    <div class="background"></div>
    
    <!-- شاشة البدء التي تتطلب تفاعل المستخدم -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <h1>مرحباً بك! 👋</h1>
            <p>انقر على الزر أدناه لبدء التحميل والصوت</p>
            <button class="start-btn" id="startBtn">
                🎵 بدء التحميل
            </button>
            <p class="hint">سيتم تشغيل الصوت تلقائياً</p>
        </div>
    </div>
    
    <!-- المحمل (مخفي في البداية) -->
    <div class="loader-container" id="loaderContainer" style="display: none;">
        <!-- From Uiverse.io by andrew-manzyk -->
        <div class="loader">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <defs>
                    <mask id="clipping">
                        <polygon points="0,0 100,0 100,100 0,100" fill="black"></polygon>
                        <polygon points="25,25 75,25 50,75" fill="white"></polygon>
                        <polygon points="50,25 75,75 25,75" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                        <polygon points="35,35 65,35 50,65" fill="white"></polygon>
                    </mask>
                </defs>
            </svg>
            <div class="box"></div>
        </div>
        
        <!-- نص التحميل -->
        <div class="loading-text">
            <h2>جاري التحميل...</h2>
            <p>الرجاء الانتظار 12 ثانية</p>
        </div>
    </div>

    <!-- مؤقت التقدم -->
    <div class="timer" id="timer" style="display: none;">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <span class="time-left">12</span> ثانية
    </div>

    <!-- الصوت (مخفي) -->
    <audio id="loading-sound" preload="auto">
        <source src="Accessories/voices/sound.mp3" type="audio/mpeg">
        <source src="Accessories/voices/sound.ogg" type="audio/ogg">
        <source src="Accessories/voices/sound.wav" type="audio/wav">
        متصفحك لا يدعم تشغيل الصوت
    </audio>

    <!-- تحميل الصفحة التالية مسبقاً -->
    <iframe src="next-page.html" style="display:none;" id="nextPage"></iframe>

    <script src="script.js"></script>
</body>
</html>
